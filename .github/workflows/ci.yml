name: CI

# Runs on pull requests only: a merge adds nothing the PR run did not already
# check, and release tags are covered by Publish.
on:
  pull_request:

# A new push to the same PR supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  binaries:
    uses: ./.github/workflows/binaries.yml

  macos-app:
    uses: ./.github/workflows/macos-app.yml
