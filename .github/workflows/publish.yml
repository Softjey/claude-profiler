name: Publish

# Publishes to npm, and the standalone executables to the GitHub release and
# the Homebrew tap, when a version tag is pushed:
#
#   pnpm version patch   # or minor / major — bumps package.json and tags vX.Y.Z
#   git push --follow-tags
#
# Authenticates through npm Trusted Publishing (OIDC), so no npm token is stored
# in the repository; provenance is attached automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; don't depend on what Node bundles.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # A version published by hand — the first one has to be, before a trusted
      # publisher can be attached to the package — still gets its release.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs `pnpm verify` (build + tests) before anything is uploaded.
      - if: steps.registry.outputs.published != 'true'
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  binaries:
    uses: ./.github/workflows/binaries.yml

  # Attaches the standalone executables to the release — where install.sh and
  # the Homebrew formula download them from — and points the tap at them.
  release-binaries:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd binaries
          sha256sum claude-profiler-*.tar.gz > checksums.txt
          cat checksums.txt
          gh release upload "$GITHUB_REF_NAME" claude-profiler-*.tar.gz checksums.txt --clobber

      # Pushing to another repository needs a token of its own: a fine-grained
      # PAT with Contents read/write on Softjey/homebrew-tap, stored as the
      # HOMEBREW_TAP_TOKEN secret. Without it the release still goes out, and
      # the formula is left to update by hand.
      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew formula was not updated"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/Softjey/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$version" binaries/checksums.txt > tap/Formula/claude-profiler.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/claude-profiler.rb
          git commit -m "claude-profiler $version"
          git push
