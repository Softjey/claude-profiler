name: Binaries

# Builds the standalone executable (scripts/build-binary.sh) on each platform
# it ships for, and uploads the archives as the `binaries` artifacts. Called
# by CI, to catch a bundle that no longer builds, and by Publish, to release
# them. `node --build-sea` builds for the machine it runs on, hence a runner
# per platform.

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2025, target: windows-x64 }
          - { runner: windows-11-arm, target: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      # The executable embeds this Node: `--build-sea` needs >= 25.5.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Git Bash on Windows; the script turns its paths into native ones.
      - run: scripts/build-binary.sh
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: build/binary/claude-profiler-${{ matrix.target }}.*
          if-no-files-found: error
