name: Binaries

# Builds the standalone executable (scripts/build-binary.sh) on each platform
# it ships for, and uploads the archives as the `binaries` artifacts. Called
# by CI, to catch a bundle that no longer builds, and by Publish, to release
# them. `node --build-sea` builds for the machine it runs on, hence a runner
# per platform.

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2025, target: windows-x64 }
          - { runner: windows-11-arm, target: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      # The executable embeds this Node: `--build-sea` needs >= 25.5.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Git Bash on Windows; the script turns its paths into native ones.
      - run: scripts/build-binary.sh
        shell: bash

      # The install scripts, end to end, against this build served locally
      # the way a release serves it.
      - name: Write checksums.txt
        shell: bash
        run: |
          cd build/binary
          if command -v sha256sum >/dev/null; then sha256sum claude-profiler-*.*; else shasum -a 256 claude-profiler-*.*; fi > checksums.txt

      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          python3 -m http.server 8765 --directory build/binary >/dev/null 2>&1 &
          curl -sf --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8765/checksums.txt >/dev/null
          CPROF_DOWNLOAD_BASE=http://127.0.0.1:8765 CPROF_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          test "$("$RUNNER_TEMP/bin/cprof" --version)" = "$(node -p "require('./package.json').version")"

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', 'build/binary' -NoNewWindow
          foreach ($attempt in 1..20) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/checksums.txt | Out-Null; break }
            catch { Start-Sleep -Seconds 1 }
          }
          $env:CPROF_DOWNLOAD_BASE = 'http://127.0.0.1:8765'
          $env:CPROF_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          ./install.ps1
          $expected = node -p "require('./package.json').version"
          $actual = & (Join-Path $env:CPROF_INSTALL_DIR 'cprof.cmd') --version
          if ($actual -ne $expected) { throw "installed cprof reports '$actual', expected '$expected'" }

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: build/binary/claude-profiler-${{ matrix.target }}.*
          if-no-files-found: error
